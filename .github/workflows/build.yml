name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/CallBridge.sln
      - name: Publish
        run: ./scripts/publish-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: CallBridge-windows
          path: build/windows/CallBridge.exe

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.CALLBRIDGE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CALLBRIDGE_KEYSTORE_PASSWORD }}
        run: |
          if ($env:KEYSTORE_B64) {
            $path = Join-Path $env:RUNNER_TEMP 'callbridge-release.p12'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_B64))
            "CALLBRIDGE_KEYSTORE=$path" >> $env:GITHUB_ENV
            "CALLBRIDGE_KEYSTORE_PASSWORD=$env:KEYSTORE_PASSWORD" >> $env:GITHUB_ENV
          }
      - name: Build APK and Magisk module
        run: ./scripts/build-android.ps1 -Module
      - uses: actions/upload-artifact@v7
        with:
          name: CallBridge-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            build/callbridge-magisk.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect files and checksums
        run: |
          mkdir out
          find dist -type f \( -name CallBridge.exe -o -name callbridge-magisk.zip -o -name app-release.apk \) -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
