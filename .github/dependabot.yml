version: 2
updates:
  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
    labels: [dependencies, windows]
    ignore:
      # NAudio 3 deprecates WasapiOut/WasapiCapture and makes BufferedWaveProvider.BufferDuration read-only
      - dependency-name: NAudio
        update-types: [version-update:semver-major]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    labels: [dependencies, android]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
